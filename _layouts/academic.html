---
layout: default
---
<div class="academic-shell">
  {% include profile-sidebar.html %}
  <main id="content" class="academic-content">
    {% unless page.home %}
      <header class="section-page-header">
        <p class="eyebrow">{{ page.kicker | default: "Pengyuan Wu" }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
      </header>
    {% endunless %}
    {{ content }}
  </main>
</div>
