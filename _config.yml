locale: en-US
site_theme: default
title: Pengyuan Wu
title_separator: "|"
name: Pengyuan Wu
description: "Pengyuan Wu is a Ph.D. student at Zhejiang University working on robot learning, embodied navigation, and world models."
url: https://wupengyuan.github.io
baseurl: ""
repository: wupengyuan/wupengyuan.github.io
timezone: Asia/Shanghai
author:
  avatar: /images/profile-photo.jpg
  name: Pengyuan Wu
  bio: "Ph.D. student in Computer Science and Technology at Zhejiang University."
  location: Hangzhou / Shanghai, China
  employer: Zhejiang University
  email: pengyuanwu0810@gmail.com
  github: wupengyuan
  googlescholar: https://scholar.google.com/citations?user=nVktZsYAAAAJ&hl=en
og_image: og-image.png
social:
  type: Person
  name: Pengyuan Wu
  links:
    - https://github.com/wupengyuan
    - https://scholar.google.com/citations?user=nVktZsYAAAAJ&hl=en
atom_feed:
  hide: true
analytics:
  provider: false
comments:
  provider: false
include:
  - _pages
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - AGENTS.md
  - CONTRIBUTING.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - SOURCE_NOTES.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - tmp
  - local
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - scripts
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed
permalink: /:title/
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
compress_html:
  clippings: all
  ignore:
    envs: development
