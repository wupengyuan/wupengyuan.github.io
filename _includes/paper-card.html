<article class="paper{% unless paper.image %} paper-text{% endunless %}" id="{{ paper.id }}">
  {% if paper.image %}
  <a class="paper-image" href="{{ paper.paper }}" aria-label="Read {{ paper.title | escape }}">
    <img src="{{ paper.image | relative_url }}" alt="{{ paper.image_alt | escape }}" width="440" height="300" loading="lazy">
  </a>
  {% endif %}
  <div class="paper-content">
    <div class="paper-meta"><span class="venue{% if paper.type == 'preprint' %} venue-preprint{% endif %}">{{ paper.venue }}{% if paper.type == 'preprint' %} · {{ paper.year }}{% endif %}</span>{% if paper.distinction %}<span class="paper-distinction">{{ paper.distinction }}</span>{% endif %}</div>
    <h3><a href="{{ paper.paper }}">{{ paper.title }}</a></h3>
    <div class="paper-authors">{{ paper.authors | markdownify }}</div>
    <div class="paper-links" aria-label="Publication resources">
      <a href="{{ paper.paper }}">Paper</a>
      {% if paper.code %}<a href="{{ paper.code }}">Code</a>{% endif %}
      <a href="{{ paper.bibtex | relative_url }}" download>BibTeX</a>
    </div>
  </div>
</article>
