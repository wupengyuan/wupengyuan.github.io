<aside class="profile-sidebar" aria-label="Profile and contact">
  <div class="profile-identity">
    {% if site.author.avatar %}
      <figure class="profile-portrait">
        <img class="profile-photo" src="{{ site.author.avatar | relative_url }}" alt="Pengyuan Wu" width="132" height="132">
        {% if site.author.avatar_credit %}<figcaption class="profile-credit">{{ site.author.avatar_credit | escape }}</figcaption>{% endif %}
      </figure>
    {% else %}
      <div class="profile-monogram" aria-hidden="true"><span>PW</span></div>
    {% endif %}
    <div>
      <a class="profile-name" href="{{ '/' | relative_url }}">Pengyuan Wu</a>
      <p class="profile-role">{{ site.data.profile.role }}</p>
    </div>
  </div>
  <div class="profile-affiliations">
    <a href="{{ site.data.profile.institution_url }}">{{ site.data.profile.institution }}</a>
    <a href="{{ site.data.profile.lab_url }}">Shanghai AI Laboratory</a>
  </div>
  <div class="profile-links">
    <a href="mailto:{{ site.author.email }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>Email <span aria-hidden="true">↗</span></a>
    <a href="{{ site.author.googlescholar }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 9 10-6 10 6-10 6-10-6Z"/><path d="M6 12v6c4 3 8 3 12 0v-6M22 9v8"/></svg>Google Scholar <span aria-hidden="true">↗</span></a>
    <a href="https://github.com/{{ site.author.github }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg>GitHub <span aria-hidden="true">↗</span></a>
  </div>
</aside>
