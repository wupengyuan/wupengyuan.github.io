<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<meta name="theme-color" content="#fafbf9">
<script>
  try {
    var savedTheme = localStorage.getItem('academic-theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
</script>
