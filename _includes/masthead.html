<a class="skip-link" href="#content">Skip to content</a>
<header class="academic-header">
  <div class="header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">pw.</span><span>Pengyuan Wu</span></a>
    <nav class="academic-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
      <button id="color-theme-toggle" class="theme-button" type="button" aria-label="Switch to dark theme" hidden><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.8 8.8 0 0 1 10 3.5 8.8 8.8 0 1 0 20.5 14Z"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
    </nav>
  </div>
</header>
